name: Preflight CI

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/ci.yml"
      - "scripts/preflight-ci.sh"
      - "acquisition/**"
      - "adapters/**"
      - "calibration/**"
      - "config/**"
      - "core/**"
      - "dataset/**"
      - "evaluation/**"
      - "explainability/**"
      - "inference/**"
      - "infra/**"
      - "labeling/**"
      - "model/**"
      - "pilot/**"
      - "quality_gate/**"
      - "reference_intelligence/**"
      - "release/**"
      - "scrapers/**"
      - "scripts/**"
      - "training/**"
      - "Containerfile.*"
      - "pyproject.toml"
      - "requirements*.lock"
      - "requirements.txt"
      - "tests/**"

permissions:
  contents: read

concurrency:
  group: preflight-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verificacao:
    name: verificacao
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Run preflight:ci
        run: bash scripts/preflight-ci.sh
